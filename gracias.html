<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización Recibida — Bistró Catering</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --y:    #F5C200;
  --ya:   #E0A800;
  --yg:   linear-gradient(135deg, #F5C200 0%, #E0A800 100%);
  --dark: #0c0c0c;
  --d2:   #131313;
  --cr:   #f0e4c8;
  --bdr:  rgba(245,194,0,0.13);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--cr);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: 'Playfair Display', serif; }
a { text-decoration: none; }
img { display: block; max-width: 100%; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--ya); border-radius: 3px; }

/* ── BACKGROUND GRAIN ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(245,194,0,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(245,194,0,0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── MAIN CARD ── */
.page-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
  max-width: 560px;
  width: 100%;
  opacity: 0;
  transform: translateY(24px);
  animation: fadeup 0.9s ease 0.1s forwards;
}
@keyframes fadeup {
  to { opacity: 1; transform: translateY(0); }
}

/* ── LOGO ── */
.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 52px;
  justify-content: center;
}
.logo-name {
  font-family: 'Playfair Display', serif;
  font-size: 21px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 3px;
}

/* ── CHECKMARK ── */
.check-wrap {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: rgba(245,194,0,0.08);
  border: 1px solid rgba(245,194,0,0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 36px;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.7s both;
}
@keyframes pop {
  from { transform: scale(0.4); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.check-wrap svg {
  width: 40px;
  height: 40px;
}

/* ── RULE ── */
.rule {
  width: 42px;
  height: 2px;
  background: var(--yg);
  margin: 20px auto 28px;
}

/* ── TEXT ── */
.lbl {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--y);
  margin-bottom: 14px;
}
.title {
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 400;
  color: #fff;
  line-height: 1.2;
}
.title em {
  font-style: italic;
  color: var(--y);
}
.body-text {
  font-size: 15px;
  color: rgba(255,255,255,0.55);
  line-height: 1.85;
  font-weight: 300;
  max-width: 420px;
  margin: 0 auto;
}

/* ── BUTTON ── */
.btn-y {
  display: inline-block;
  margin-top: 40px;
  background: var(--y);
  color: #0c0c0c;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 14px 40px;
  border-radius: 3px;
  transition: opacity 0.25s, transform 0.25s;
}
.btn-y:hover {
  opacity: 0.85;
  transform: translateY(-2px);
}

/* ── DIVIDER LINE ── */
.sep {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, transparent, rgba(245,194,0,0.28), transparent);
  margin: 40px auto 0;
}

/* ── CONTACT HINT ── */
.hint {
  margin-top: 18px;
  font-size: 12px;
  color: rgba(255,255,255,0.28);
  letter-spacing: 0.3px;
}
.hint a {
  color: rgba(245,194,0,0.7);
  transition: color 0.2s;
}
.hint a:hover {
  color: var(--y);
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .page-wrap { padding: 48px 20px; }
  .logo { margin-bottom: 40px; }
  .check-wrap { width: 74px; height: 74px; }
  .check-wrap svg { width: 32px; height: 32px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- Logo -->
  <a href="index.html" class="logo">
    <img src="logo-bistro.png" alt="Bistró Logo" width="40" height="40" style="border-radius:9px;object-fit:contain">
    <span class="logo-name">BISTRÓ</span>
  </a>

  <!-- Gold checkmark -->
  <div class="check-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F5C200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <!-- Label -->
  <div class="lbl">Mensaje enviado</div>

  <!-- Heading -->
  <h1 class="title">¡Cotización <em>Recibida!</em></h1>

  <!-- Decorative rule -->
  <div class="rule"></div>

  <!-- Body -->
  <p class="body-text">
    Gracias por contactarnos. Carolina se pondrá en contacto contigo a la brevedad para darte una propuesta personalizada.
  </p>

  <!-- CTA -->
  <a href="index.html" class="btn-y">Volver al inicio</a>

  <!-- Separator + hint -->
  <div class="sep"></div>
  <p class="hint">
    ¿Tienes urgencia? Escríbenos a&nbsp;
    <a href="https://wa.me/56984194213">WhatsApp</a>
    &nbsp;o&nbsp;
    <a href="mailto:bistrocaterings@gmail.com">bistrocaterings@gmail.com</a>
  </p>

</div>

</body>
</html>
